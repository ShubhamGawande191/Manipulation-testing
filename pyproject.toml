[project]
name = "robot-manipulator"
version = "0.1.0"
description = "SO101 arm lab — teleoperation, pick-and-place, imitation learning and beyond"
requires-python = ">=3.12"
dependencies = [
    # Robot arm control — Feetech servo support for SO101 leader/follower arms
    # OpenCV is bundled as a transitive dependency; do NOT add opencv-python here.
    "lerobot[feetech]>=0.5.0",
    # AI agent orchestration for zero-code task pipelines (https://cmdop.com)
    "openclaw>=2026.3.12",
    # Numerics / data
    "numpy>=2.0",
    "scipy>=1.14",
    "pyarrow>=17",
    # MIDI codec + event model (live ports need the `midi` extra's rtmidi backend)
    "mido>=1.3",
    # WebSocket client for the ROS2 bridge tasks (BridgeClient)
    "websockets>=13",
    # AprilTag detection (tasks/detect_apriltag.py, find_world_tag.py)
    "pupil-apriltags>=1.0.4",
    # Config & environment
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # sim2real joint map + harness config (config/sim2real.yaml)
    "pyyaml>=6.0",
    # Rich terminal output
    "rich>=13.9",
    # CLI
    "typer>=0.12",
]

[project.optional-dependencies]
midi = ["python-rtmidi>=1.5"]
audio = ["sounddevice>=0.5"]
# MuJoCo sim, RL training (SB3 PPO), ONNX deploy of trained policies
sim = [
    "mujoco>=3.3",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "matplotlib>=3.8",
]
dev = [
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
bench-check = "robot_manipulator.scripts.bench_check:app"
calibrate = "robot_manipulator.scripts.calibrate:app"
teleoperate = "robot_manipulator.scripts.teleoperate:app"
pick-and-place = "robot_manipulator.scripts.pick_and_place:app"
sim-train-reach = "robot_manipulator.sim.train_reach:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_manipulator"]

[tool.uv.sources]
# PyPI no longer lists openclaw 2026.x (only 2.0.x), so every fresh `uv lock` fails.
# Pin the exact wheel the previous uv.lock was built from (sha256 16b84601…dfb, same as lock).
openclaw = { url = "https://files.pythonhosted.org/packages/f3/b5/508e36856bf3a741f772b5e38d6c32b3fa977e50752168cba463250dc734/openclaw-2026.3.20-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["hw: needs the physical bench (arm, MiniLab 3, cameras); run manually with -m hw"]
addopts = "-m 'not hw'"
