[project]
name = "robot-manipulator"
version = "0.1.0"
description = "SO101 arm lab — teleoperation, pick-and-place, imitation learning and beyond"
requires-python = ">=3.12"
dependencies = [
    # Robot arm control — Feetech servo support for SO101 leader/follower arms
    # OpenCV is bundled as a transitive dependency; do NOT add opencv-python here.
    "lerobot[feetech]>=0.5.0",
    # Numerics / data
    "numpy>=2.0",
    "scipy>=1.14",
    "pyarrow>=17",
    # MIDI codec + event model (live ports need the `midi` extra's rtmidi backend)
    "mido>=1.3",
    # WebSocket client for the ROS2 bridge tasks (BridgeClient)
    "websockets>=13",
    # AprilTag detection (tasks/detect_apriltag.py, find_world_tag.py)
    "pupil-apriltags>=1.0.4",
    # Config & environment
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # sim2real joint map + harness config (config/sim2real.yaml)
    "pyyaml>=6.0",
    # Rich terminal output
    "rich>=13.9",
    # CLI
    "typer>=0.12",
]

[project.optional-dependencies]
midi = ["python-rtmidi>=1.5"]
audio = ["sounddevice>=0.5"]
# MuJoCo sim, RL training (SB3 PPO), ONNX deploy of trained policies
sim = [
    "mujoco>=3.3",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "matplotlib>=3.8",
]
dev = [
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
bench-check = "robot_manipulator.scripts.bench_check:app"
calibrate = "robot_manipulator.scripts.calibrate:app"
teleoperate = "robot_manipulator.scripts.teleoperate:app"
sim-train-reach = "robot_manipulator.sim.train_reach:app"
harness = "robot_manipulator.harness.cli:app"
twin = "robot_manipulator.harness.twin:app"
cam-setup = "robot_manipulator.cameras:cam_setup_app"
camcal = "robot_manipulator.calib.camera:app"
atlas = "robot_manipulator.sim.atlas:app"
teleop = "robot_manipulator.tasks.teleop_staged:app"
calib-check = "robot_manipulator.calib.check:app"
calib-recal = "robot_manipulator.calib.recal:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_manipulator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["hw: needs the physical bench (arm, MiniLab 3, cameras); run manually with -m hw"]
addopts = "-m 'not hw'"
