# Lab board: what is next in this repo, shown as bots in Bot Crossing (`uv run colony-feed`).
#   owner:  you | agent      status: todo | doing | waiting | done | failed
#   you + todo = a `?` bot (needs you)   doing = hammering   failed = `!`   done = confetti, 2 days
# Agents: set `doing` when you start a task, `done`/`waiting` when you stop, and bump `updated`.
tasks:
