    title: Run the automatic wrist-camera calibration on the arm
    owner: you
    status: done
    detail: >-
      Fold the arm back by hand, then `uv run camcal-wrist run --backend real --live` (~4 min,
      stay at the arm). The arm photographs the board from 24 planned viewpoints.
    link: docs/DIGITAL-TWIN-RUNBOOK.md
    updated: 2026-10-18
