# sim <-> LeRobot joint map. Read only by robot_manipulator.harness.units.
#
# Harness and sim use radians in CMD order. LeRobot's SO101 follower reports body
# joints in degrees and the gripper in 0..100. Per joint:
#     rad = sign * deg2rad(deg) + deg2rad(offset_deg)
#
# The values below are placeholders. Fill them in during hardware ticket H2 (see
# docs/HARNESS-SIM2REAL-PLAN.md), then set calibrated: true. A real-robot run is refused
# while calibrated is false.
# H2 done 2026-10-17: signs/offsets validated with the live twin (`uv run twin`) against the real
# follower (calibration rewritten by calib-recal the same day; MJCF "new calib" zero = range midpoint).
calibrated: true

joints:
  shoulder_pan: {sign: 1, offset_deg: 0.0}   # H2: validated 2026-10-17
  shoulder_lift: {sign: 1, offset_deg: 0.0}  # H2: validated 2026-10-17
  elbow_flex: {sign: 1, offset_deg: 0.0}     # H2: validated 2026-10-17
  wrist_flex: {sign: 1, offset_deg: 0.0}     # H2: validated 2026-10-17
  wrist_roll: {sign: 1, offset_deg: 0.0}     # H2: validated 2026-10-17

# Linear map. LeRobot value lerobot_open maps to sim_open, and lerobot_closed maps to
# sim_closed. Values outside the range are clipped.
gripper:
  lerobot_open: 100.0      # LeRobot convention 0 = closed, 100 = open (follower gripper drive_mode 1)
  lerobot_closed: 7.0      # fingers touch at ~6.8 (calibrated endpoint 3200 steps includes preload)
  sim_open: -1.833         # rad, PincOpen coupler joint in sim/assets/so101/so101_pinc.xml (105 deg servo travel)
  sim_closed: 0.0          # rad, fingers touching
