# Leader stow: before a live policy / survey / gap run the leader rotates its pan to its LEFT
# (away from the follower) so the follower has room. Survey pose 16 (2026-10-18) stalled
# 5.9 deg short on pan near (0.12, +0.18, 0.07): the follower hit the leader.
# Pan is absolute, in the leader's LeRobot degrees (rest is about -3). Positive = leader's left
# (verify visually with `uv run leader-stow --dry-run` first).
port: /dev/so101_leader
leader_id: my_so101_leader
stow_pan_deg: 60.0
torque_limit: 300      # permille: gentle, yields if touched
speed_deg_s: 30.0
